# CrowPanel 5.79" E-Paper — Battery Power Management Example
#
# Demonstrates two approaches to graceful display power-down when battery
# voltage is low. This prevents the all-black screen flash that occurs when
# the ESP32 crashes from low voltage and GPIO glitches trigger a spurious
# refresh waveform on the SSD1683 chips.
#
# The driver's power_down() method sends SSD1683 deep sleep command 0x10
# (mode 1). In deep sleep the chips ignore all SPI traffic, so the physical
# e-ink image is retained without any further refresh.
#
# ── Voltage divider wiring ────────────────────────────────────────────────────
#
#   Battery (+) ──┬── 100kΩ ──┬── GPIO3  (or any free ADC1 pin: GPIO1-GPIO10)
#                 │           │
#                GND        100kΩ
#                             │
#                            GND
#
#   Two equal resistors give a 2:1 divider:
#     4.2V (full LiPo)  → 2.1V into ADC  → multiply: 2.0 → 4.2V reported
#     3.0V (empty LiPo) → 1.5V into ADC  → multiply: 2.0 → 3.0V reported
#
#   Use ADC1 pins only (GPIO1–GPIO10 on ESP32-S3).
#   ADC2 (GPIO11–GPIO20) conflicts with WiFi and gives unreliable readings.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: crowpanel-battery
  friendly_name: "CrowPanel Battery"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  # ── Option B: on_shutdown hook ──────────────────────────────────────────────
  # ESPHome calls on_shutdown before OTA reboots and user-triggered restarts.
  # It also fires on some (not all) brownout resets depending on ESP-IDF
  # brownout detector settings. Good as a safety net; not a full replacement
  # for Option A when the battery dies with no warning.
  on_shutdown:
    then:
      - lambda: "id(my_display).power_down();"
  # ───────────────────────────────────────────────────────────────────────────

  on_boot:
    priority: -100
    then:
      - component.update: my_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://samperk1/esphome-crowpanel-579
    components: [crowpanel_579]

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

# ── Option A: ADC battery voltage sensor ─────────────────────────────────────
# Monitors real battery voltage and calls power_down() when it goes low.
# This is the most reliable option — fires before the voltage drops far enough
# to cause a brownout crash.
sensor:
  - platform: adc
    pin: GPIO3                  # change to whichever free ADC1 pin you use
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    attenuation: auto           # covers ~0.075V–3.1V, uses factory calibration
    samples: 10                 # average 10 readings to reduce noise
    update_interval: 60s
    filters:
      - multiply: 2.0           # compensate for 2:1 voltage divider
    on_value_range:
      - below: 3.5              # LiPo safe cutoff — adjust for your chemistry:
                                #   LiPo:   3.5V warning, 3.0V absolute minimum
                                #   LiFePO4: 3.0V warning, 2.8V absolute minimum
        then:
          - lambda: "id(my_display).power_down();"
          - logger.log: "Battery low — display powered down"

  # Battery percentage — visible in Home Assistant
  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.0 -> 0            # adjust these to match your battery's actual
          - 4.2 -> 100          # measured voltages at empty and full
      - clamp:
          min_value: 0
          max_value: 100
# ─────────────────────────────────────────────────────────────────────────────

font:
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 36
  - file: "gfonts://Roboto@400"
    id: font_body
    size: 20
  - file: "gfonts://Roboto@400"
    id: font_small
    size: 14

display:
  - platform: crowpanel_579
    id: my_display
    cs_pin: GPIO45
    dc_pin: GPIO46
    reset_pin: GPIO47
    busy_pin:
      number: GPIO48
      mode:
        input: true
        pulldown: true
    # power_pin: GPIO7          # uncomment if your board has display power control
    auto_clear_enabled: false
    update_interval: never
    lambda: |-
      it.fill(Color::BLACK);  // Color::BLACK = white paper background

      // Show battery voltage and level on screen
      it.printf(396, 60,  id(font_large), Color::WHITE, display::TextAlign::TOP_CENTER,
                "Battery: %.2fV", id(battery_voltage).state);
      it.printf(396, 110, id(font_body),  Color::WHITE, display::TextAlign::TOP_CENTER,
                "Level: %.0f%%", id(battery_voltage).state);
      it.printf(396, 200, id(font_small), Color::WHITE, display::TextAlign::TOP_CENTER,
                "Power-down triggers below 3.5V");

      id(my_display).display();
