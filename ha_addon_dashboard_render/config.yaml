name: "Dashboard Render (E-Paper)"
version: "1.0.1"
slug: "dashboard_render"
description: "Screenshots a Home Assistant Lovelace view and renders it as a dithered 1-bit PNG for e-paper displays (e.g. CrowPanel 5.79)"
url: "https://github.com/samperk1/esphome-crowpanel-579"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
options:
  dashboard_url: "http://homeassistant.local:8123/lovelace-epaper/0"
  width: 792
  height: 272
  interval_seconds: 300
  output_path: "/config/www/dashboard.png"
schema:
  dashboard_url: "url"
  width: "int(64,4096)"
  height: "int(64,4096)"
  interval_seconds: "int(30,86400)"
  output_path: "str"
map:
  - config:rw
